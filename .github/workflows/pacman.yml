name: Update Pac-Man Graph

on:
  schedule:
    - cron: "0 0 * * *"  # Executa diariamente
  workflow_dispatch:      # Acionamento manual
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate GitHub Activity
        uses: Platane/snk@v2
        with:
          github_user_name: guumarques
          outputs: |
            dist/github-activity.svg
            dist/github-activity-dark.svg?palette=github-dark
